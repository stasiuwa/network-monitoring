apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-monitoring-app
  namespace: argocd
spec:
  project: monitoring-project
  source:
    repoURL: "git@github.com:stasiuwa/network-monitoring.git"
    path: "kubernetes/network-monitoring"
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "network-monitoring"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true