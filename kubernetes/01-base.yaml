apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: monitoring
type: Opaque
stringData:
  POSTGRES_USER: "zabbix"
  POSTGRES_PASSWORD: "zabbix_password"
  POSTGRES_DB: "zabbix"
  DB_SERVER_HOST: "postgres"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-env
  namespace: monitoring
data:
  ZBX_SERVER_HOST: "zabbix-server"
  ZBX_SERVER_PORT: "10051"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: monitoring
data:
  logstash.yml: |
    pipeline.workers: 2
    pipeline.batch.size: 125
    log.level: info
    config.reload.automatic: true
  logstash.conf: |
    input {
      beats {
        port => 5044
        host => "0.0.0.0"
      }
    }

    filter {
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }
      mutate {
        add_field => { "[@metadata][target_index]" => "suricata-alerts" }
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "filebeat-%{+YYYY.MM.dd}"
      }
      stdout {
        codec => rubydebug
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zabbix-agent-config
  namespace: monitoring
data:
  zabbix_agent2.conf: |
    Server=zabbix-server
    ServerActive=zabbix-server
    Hostname=zabbix-agent

    ListenPort=10050
    ListenIP=0.0.0.0

    LogFile=/dev/stdout
    LogFileSize=0